# Blueprint de Render para K'anba · Cuevas Vivas — plan gratuito
# Documentación: https://render.com/docs/blueprint-spec
#
# Un único Web Service (plan Free) sirve el sitio público, el panel y la API.
# La persistencia va a una base PostgreSQL externa gratuita (Neon, Supabase, etc.)
# configurada con la variable DATABASE_URL. Sin ella se usa data/db.json y los
# datos se pierden en cada reinicio (el filesystem de Render Free es efímero).
services:
  - type: web
    name: cuevas-de-kanba
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Cadena de conexión de PostgreSQL (Neon/Supabase/Render Postgres).
      # Render pedirá este valor al crear el servicio (no se guarda en el repositorio).
      - key: DATABASE_URL
        sync: false
      # Render pedirá este valor al crear el servicio (no se guarda en el repositorio).
      - key: ADMIN_PASSWORD
        sync: false
